    <title>World-Clock by Susan Borders</title>

<body>
    <div class="container">
    <h1>World Clock</h1>
    <select>
        <option value="">Select a city...</option>
        <option value="">London</option>
        <option value="">New York</option>

    <div class="city">
        <div>

        </div>

    </div>
    <div class="city">
        <div>
            <h2>Paris 🇫🇷</h2>
            <div class="date">October 20th, 2026</div>
        </div>
        <div class="time">7:51:06 <small>AM</small></div>
    </div>

    </div>
